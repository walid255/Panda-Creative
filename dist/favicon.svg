<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pandaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Ring / Shutter / Aperture ring -->
  <circle cx="50" cy="50" r="46" fill="url(#pandaGrad)" stroke="#27272a" stroke-width="2"/>
  
  <!-- Ears -->
  <ellipse cx="26" cy="22" rx="11" ry="9" fill="#09090b" transform="rotate(-20 26 22)"/>
  <ellipse cx="26" cy="22" rx="7" ry="5" fill="#27272a" transform="rotate(-20 26 22)"/>
  
  <ellipse cx="74" cy="22" rx="11" ry="9" fill="#09090b" transform="rotate(20 74 22)"/>
  <ellipse cx="74" cy="22" rx="7" ry="5" fill="#27272a" transform="rotate(20 74 22)"/>
  
  <!-- Panda Head / Face (Crisp White with subtle shadow) -->
  <path d="M 24 45 C 24 28, 76 28, 76 45 C 78 62, 68 80, 50 82 C 32 80, 22 62, 24 45 Z" fill="#ffffff"/>
  
  <!-- Camera Shutter Blades around head / Lens ring -->
  <circle cx="50" cy="52" r="30" fill="none" stroke="#e4e4e7" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Eye Patches (Panda signature + Camera aperture lens styling) -->
  <ellipse cx="38" cy="48" rx="8" ry="11" fill="#18181b" transform="rotate(-15 38 48)"/>
  <ellipse cx="62" cy="48" rx="8" ry="11" fill="#18181b" transform="rotate(15 62 48)"/>
  
  <!-- Camera Lens Eyes (Shining emerald green cine-coating) -->
  <circle cx="39" cy="49" r="4.5" fill="url(#bambooGrad)" filter="url(#glow)"/>
  <circle cx="38" cy="47.5" r="1.5" fill="#ffffff"/>
  
  <circle cx="61" cy="49" r="4.5" fill="url(#bambooGrad)" filter="url(#glow)"/>
  <circle cx="60" cy="47.5" r="1.5" fill="#ffffff"/>
  
  <!-- Snout & Nose -->
  <ellipse cx="50" cy="62" rx="7" ry="4.5" fill="#f4f4f5"/>
  <path d="M 47 60 Q 50 58 53 60 Q 50 63 47 60 Z" fill="#09090b"/>
  <path d="M 50 62 L 50 66 M 47 66 Q 50 68 53 66" fill="none" stroke="#09090b" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Film / Record dot indicator in corner -->
  <circle cx="76" cy="74" r="5" fill="#ef4444"/>
  <circle cx="76" cy="74" r="3" fill="#f87171"/>
</svg>