  <body class="bg-white text-zinc-900 dark:bg-[#0c0d0f] dark:text-zinc-100 antialiased selection:bg-bamboo-500 selection:text-white transition-colors duration-300">

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Panda Creative PWA ServiceWorker registered with scope: ', registration.scope);
            })
            .catch((err) => {
              console.log('PWA ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
